---
# This template has higher priority than the restartable GPU inference pod.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: inflasi-train-tft-h7
  namespace: default
  labels: { app: inflasi-training, component: tft }
spec:
  schedule: "0 0 1 1 *"
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 43200
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels: { app: inflasi-training, component: tft }
        spec:
          serviceAccountName: inflasi-training
          priorityClassName: inflasi-gpu-training
          restartPolicy: OnFailure
          imagePullSecrets: [{ name: ghcr-secret }]
          runtimeClassName: nvidia
          nodeSelector:
            accelerator: nvidia-a100
          tolerations:
            - key: nvidia.com/gpu
              operator: Exists
              effect: NoSchedule
          containers:
            - name: trainer
              image: ghcr.io/wahyurendra/inflasi-training-gpu:latest
              imagePullPolicy: Always
              args: ["ml.training.train_tft", "--horizon", "7"]
              envFrom:
                - secretRef: { name: inflasi-training-secret, optional: true }
              env:
                - { name: API_GATEWAY_URL, value: "http://inflasi-api:8080" }
                - { name: GCS_BUCKET, value: "train-ml" }
                - { name: MODEL_VERSION, value: "v1" }
              resources:
                requests: { cpu: "2", memory: "8Gi", "nvidia.com/gpu": "1" }
                limits: { cpu: "8", memory: "24Gi", "nvidia.com/gpu": "1" }
---
