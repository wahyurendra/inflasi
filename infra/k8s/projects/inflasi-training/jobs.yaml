# Suspended CronJobs are mutable GitOps templates; they never run on schedule.
# Start one with:
#   kubectl create job --from=cronjob/<name> <name>-$(date +%Y%m%d%H%M%S)
#
# Order: export -> lightgbm -> prophet -> sarimax -> tft -> ensemble.
# CI safely bumps images in jobTemplate. This avoids immutable one-shot Jobs
# remaining stuck forever on a bootstrap image such as 0.0.0.
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: inflasi-train-export
  namespace: default
  labels: { app: inflasi-training, component: export }
spec:
  schedule: "0 0 1 1 *"
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels: { app: inflasi-training, component: export }
        spec:
          serviceAccountName: inflasi-training
          restartPolicy: OnFailure
          imagePullSecrets: [{ name: ghcr-secret }]
          containers:
            - name: trainer
              image: ghcr.io/wahyurendra/inflasi-training:latest
              imagePullPolicy: Always
              args: ["ml.training.export_dataset"]
              envFrom:
                - secretRef: { name: inflasi-training-secret, optional: true }
              env:
                - { name: API_GATEWAY_URL, value: "http://inflasi-api:8080" }
                - { name: GCS_BUCKET, value: "train-ml" }
                - { name: MODEL_VERSION, value: "v1" }
              resources:
                requests: { cpu: "500m", memory: "2Gi" }
                limits: { cpu: "4", memory: "8Gi" }
