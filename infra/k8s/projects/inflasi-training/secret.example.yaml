# Example only — DO NOT commit real secrets. Create in-cluster:
#
#   kubectl create secret generic inflasi-training-secret -n default \
#     --from-literal=ADMIN_FIREBASE_TOKEN='<admin-id-token>'
#
# GCS uses Application Default Credentials via the `inflasi-training` Kubernetes
# service account. Do not put a Google service-account JSON key in this Secret.
# ADMIN_FIREBASE_TOKEN is needed for the trainer to POST /api/v1/admin/models;
# without it the artifact still uploads to GCS and a human can register it.
---
apiVersion: v1
kind: Secret
metadata:
  name: inflasi-training-secret
  namespace: default
type: Opaque
stringData:
  ADMIN_FIREBASE_TOKEN: ""
