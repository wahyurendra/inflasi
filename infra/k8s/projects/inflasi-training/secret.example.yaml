# Example only — DO NOT commit the real token. Create this Secret once through
# Rancher in namespace `default` and mount the same value into API + training.
# Generate a strong token locally with: openssl rand -hex 32
---
apiVersion: v1
kind: Secret
metadata:
  name: inflasi-training-service-secret
  namespace: default
type: Opaque
stringData:
  TRAINING_SERVICE_TOKEN: "replace-with-at-least-32-random-characters"
