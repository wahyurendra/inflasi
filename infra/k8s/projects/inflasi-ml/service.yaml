# Stable, always-on ClusterIP. API Gateway never points directly at the GPU pod.
apiVersion: v1
kind: Service
metadata:
  name: inflasi-ml
  namespace: default
  labels: { app: inflasi-ml }
spec:
  type: ClusterIP
  selector: { app: inflasi-ml, compute: cpu }
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
