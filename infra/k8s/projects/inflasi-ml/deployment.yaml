# Always-on ML API. CPU-capable models stay available while the only GPU is
# preempted by TFT training. TFT and OCR are delegated to inflasi-ml-gpu.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inflasi-ml-cpu
  namespace: default
  labels: { app: inflasi-ml, compute: cpu }
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels: { app: inflasi-ml, compute: cpu }
  template:
    metadata:
      labels: { app: inflasi-ml, compute: cpu }
    spec:
      serviceAccountName: inflasi-ml
      imagePullSecrets:
        - name: ghcr-secret
      # Do not consume CPU/RAM on the dedicated GPU node when regular workers
      # are available. This is preferred, not required, to survive small clusters.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: accelerator
                    operator: DoesNotExist
      containers:
        - name: ml-gateway
          # Bootstrap tag; CD replaces this with the immutable 12-char commit SHA.
          image: ghcr.io/wahyurendra/inflasi-ml-cpu:bc59dc834652
          imagePullPolicy: Always
          ports:
            - { containerPort: 8080, name: http }
          env:
            - { name: WORKLOAD_ROLE, value: "cpu" }
            - { name: MODEL_CACHE_DIR, value: "/models" }
            - { name: GCS_BUCKET, value: "train-ml" }
            - { name: API_GATEWAY_URL, value: "http://inflasi-api:8080" }
            - { name: GPU_GATEWAY_URL, value: "http://inflasi-ml-gpu:8080" }
          readinessProbe:
            httpGet: { path: /ready, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: { cpu: "1", memory: "2Gi" }
            limits: { cpu: "4", memory: "8Gi" }
          volumeMounts:
            - { name: model-cache, mountPath: /models }
      volumes:
        # Artifacts remain canonical in GCS. A disposable cache avoids sharing
        # the GPU pod's ReadWriteOnce PVC and cannot block scheduling.
        - name: model-cache
          emptyDir:
            sizeLimit: 20Gi
